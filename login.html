<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover Egypt's best travel experiences and book premium bus trips to the country's most iconic destinations."
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Rihla — Egypt Travel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./assets/images/Logo.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="assets/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="login-image">
          <img
            src="./assets/images/compononet-img.png"
            alt="Egyptian pyramids and desert"
          />
        </div>

        <div class="login-content">
          <div class="login-wrapper">
            <a href="./index.html" class="login-logo">
              <img src="./assets/images/Logo.png" alt="Rihla Egypt Travel" />
            </a>

            <div class="login-heading">
              <h1>Welcome Back</h1>

              <p>Sign in to your account to continue your journey</p>
            </div>

            <form class="login-form" action="index.html" method="post">
              <div class="form-group">
                <label for="email">Email Address</label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="name@gmail.com"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">Password</label>

                <div class="password-field">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                  />

                  <span class="password-icon">
                    <i class="fa-regular fa-eye"></i>
                  </span>
                </div>
              </div>

              <div class="form-options">
                <label class="remember-me">
                  <input type="checkbox" name="remember" />
                  <span>Remember me</span>
                </label>

                <a href="forgot-password.html">Forgot password?</a>
              </div>

              <button type="submit" class="login-button">
                <a href="index.html">Login</a>
              </button>

              <div class="divider">
                <span>Or continue with</span>
              </div>

              <div class="social-login">
                <button type="button">
                  <i class="fa-brands fa-google"></i>
                  <span>Google</span>
                </button>

                <button type="button">
                  <i class="fa-brands fa-apple"></i>
                  <span>Apple</span>
                </button>
              </div>

              <p class="create-account">
                Don't have an account?
                <a href="signup.html">Create account</a>
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
