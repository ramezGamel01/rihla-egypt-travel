<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rihla — Bus travel across Egypt</title>
    <meta name="description" content="Book bus trips across Egypt: search routes, compare departures, pick your seats in 2D or 3D and get your ticket. A demo built with React and three.js." />
    <meta name="theme-color" content="#fff8ef" />
    <meta property="og:title" content="Rihla — Bus travel across Egypt" />
    <meta property="og:description" content="Search routes, pick seats in 3D and get your ticket. A React and three.js demo." />
    <meta property="og:image" content="https://ramezgamel01.github.io/rihla-egypt-travel/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/rihla-egypt-travel/favicon.svg" />
    <script>
      // Apply the saved language and theme before the first paint
      (function () {
        try {
          var d = document.documentElement;
          var lang = localStorage.getItem("rihla:lang");
          if (lang === "ar") { d.lang = "ar"; d.dir = "rtl"; }
          var theme = localStorage.getItem("rihla:theme");
          if (theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches)) d.dataset.theme = "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Rihla needs JavaScript to search and book trips.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
