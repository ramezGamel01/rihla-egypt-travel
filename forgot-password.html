<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./assets/css/password.css" />

    <title>Forgot Password | Rihla</title>
  </head>

  <body>
    <main class="password-page">
      <section class="password-card">
        <div class="password-image">
          <img
            src="./assets/images/compononet-img.png"
            alt="Egyptian pyramids and desert"
          />
        </div>

        <div class="password-content">
          <div class="password-wrapper">
            <a href="./index.html" class="password-logo">
              <img src="./assets/images/Logo.png" alt="Rihla Egypt Travel" />
            </a>

            <div class="password-heading">
              <h1>Forgot Password?</h1>
              <p>
                Don't worry! Enter your email and we'll send you a verification
                code
              </p>
            </div>

            <form action="./verify.html" method="get" class="password-form">
              <div class="form-group">
                <label for="email">Email Address</label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="name@gmail.com"
                  required
                />
              </div>

              <button type="submit" class="main-button">
                Send Verification Code
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
