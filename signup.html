    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
          name="description"
          content="Create your Rihla Egypt Travel account."
        />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet"
        />

        <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        />

        <link
          rel="shortcut icon"
          href="./assets/images/Logo.png"
          type="image/x-icon"
        />

        <link rel="stylesheet" href="./assets/css/signup.css" />

        <title>Sign Up | Rihla</title>
      </head>

      <body>
        <main class="signup-page">
          <section class="signup-card">
            <div class="signup-image">
              <img
                src="./assets/images/compononet-img.png"
                alt="Egyptian pyramids and desert"
              />
            </div>

            <div class="signup-content">
              <div class="signup-wrapper">
                <a href="./index.html" class="signup-logo">
                  <img
                    src="./assets/images/Logo.png"
                    alt="Rihla Egypt Travel"
                  />
                </a>

                <div class="signup-heading">
                  <h1>Create Account</h1>
                  <p>Join 50,000+ travelers exploring Egypt</p>
                </div>

                <form class="signup-form" action="#" method="post">
                  <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                      type="text"
                      id="name"
                      name="name"
                      placeholder="Name"
                      autocomplete="name"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                      type="email"
                      id="email"
                      name="email"
                      placeholder="name@gmail.com"
                      autocomplete="email"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-field">
                      <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                      />

                      <span class="password-icon">
                        <i class="fa-regular fa-eye"></i>
                      </span>
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <div class="password-field">
                      <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                      />

                      <span class="password-icon">
                        <i class="fa-regular fa-eye"></i>
                      </span>
                    </div>
                  </div>

                  <button type="submit" class="signup-button">
                    Create Account
                  </button>

                  <p class="sign-in">
                    Have an account?
                    <a href="./login.html">Sign in</a>
                  </p>
                </form>
              </div>
            </div>
          </section>
        </main>
      </body>
    </html>
  </body>
</html>
