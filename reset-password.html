<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./assets/css/password.css" />

    <title>Reset Password | Rihla</title>
  </head>

  <body>
    <main class="password-page">
      <section class="password-card">
        <div class="password-image">
          <img
            src="./assets/images/compononet-img.png"
            alt="Egyptian pyramids and desert"
          />
        </div>

        <div class="password-content">
          <div class="password-wrapper">
            <a href="./index.html" class="password-logo">
              <img src="./assets/images/Logo.png" alt="Rihla Egypt Travel" />
            </a>

            <div class="password-heading">
              <h1>Reset Password</h1>
              <p>Create a new secure password for your account</p>
            </div>

            <form action="./login.html" method="get" class="password-form">
              <div class="form-group">
                <label for="password">Password</label>

                <div class="password-input">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                  />

                  <span>
                    <i class="fa-regular fa-eye"></i>
                  </span>
                </div>
              </div>

              <div class="form-group">
                <label for="confirm-password">Confirm Password</label>

                <div class="password-input">
                  <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="••••••••"
                    required
                  />

                  <span>
                    <i class="fa-regular fa-eye"></i>
                  </span>
                </div>
              </div>

              <button type="submit" class="main-button reset-button">
                Reset Password
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
